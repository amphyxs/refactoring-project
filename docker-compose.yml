version: "3.8"
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./db/create.sql:/docker-entrypoint-initdb.d/create.sql
      - ./db/function_procedure.sql:/docker-entrypoint-initdb.d/function_procedure.sql
      - ./db/index.sql:/docker-entrypoint-initdb.d/index.sql
      - ./db/trigger.sql:/docker-entrypoint-initdb.d/trigger.sql
