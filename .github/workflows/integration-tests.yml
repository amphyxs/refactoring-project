name: Integration Tests

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: parapp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Wait for PostgreSQL
      run: |
        timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'

    - name: Set up database schema
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d parapp_test -f db/create.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d parapp_test -f db/function_procedure.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d parapp_test -f db/trigger.sql
        PGPASSWORD=postgres psql -h localhost -U postgres -d parapp_test -f db/index.sql

    - name: Run integration tests
      run: mvn clean test -Dtest="*IntegrationTest"
      env:
        SPRING_PROFILES_ACTIVE: test
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/parapp_test
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          target/surefire-reports/
          target/test-results/

    - name: Publish test report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Integration Test Results
        path: target/surefire-reports/TEST-*.xml
        reporter: java-junit
        fail-on-error: true
